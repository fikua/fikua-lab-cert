# Serves the cert-enrollment frontend and the /cert-info endpoint.
#
# Traefik terminates TLS+mTLS in front of us (clientAuthType=RequestClientCert,
# no CA validation) and forwards the parsed cert via the
# `X-Forwarded-Tls-Client-Cert-Info` header injected by the
# `passTLSClientCert` middleware. The header is semicolon-separated and
# URL-encoded — see https://doc.traefik.io/traefik/middlewares/http/passtlsclientcert/.
# We forward it verbatim to the frontend (as `X-Client-Cert-Info`) and let
# app.js decode + parse, since the format varies enough between CAs (FNMT,
# ACCV, AC Camerfirma, …) that handling it in nginx is fragile.

map $http_x_forwarded_tls_client_cert_info $cert_present {
    ""      0;
    default 1;
}

server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # /cert-info — 204 with two headers: X-Client-Verify (0/1) and
    # X-Client-Cert-Info (the raw Traefik header, URL-encoded). The frontend
    # decodes and parses it because the format varies between CAs and is
    # fragile to handle in nginx regex maps.
    location = /cert-info {
        add_header X-Client-Verify        $cert_present always;
        add_header X-Client-Cert-Info     $http_x_forwarded_tls_client_cert_info always;
        add_header Access-Control-Expose-Headers
            "X-Client-Verify, X-Client-Cert-Info" always;
        add_header Cache-Control          "no-store" always;
        return 204;
    }

    # Debug — exposes the raw X-Forwarded-Tls-Client-Cert-Info header that
    # Traefik forwards, so we can see how a given client cert is actually
    # serialised (FNMT, ACCV, etc. each format Subject DNs differently).
    # Remove once the field-extraction regexes in nginx.conf cover all the
    # CAs we care about.
    location = /cert-debug {
        default_type text/plain;
        return 200 "X-Forwarded-Tls-Client-Cert-Info:\n$http_x_forwarded_tls_client_cert_info\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
