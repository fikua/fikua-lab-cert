# Serves the cert-enrollment frontend and the /cert-info endpoint.
#
# Traefik terminates TLS+mTLS in front of us (clientAuthType=RequestClientCert,
# no CA validation) and forwards the parsed cert via the
# `X-Forwarded-Tls-Client-Cert-Info` header injected by the
# `passTLSClientCert` middleware. We translate that into the historical
# `X-Client-*` header contract the static `app.js` already consumes, so the
# frontend does not change.

map $http_x_forwarded_tls_client_cert_info $cert_present {
    ""      0;
    default 1;
}

# Pull individual fields out of the Traefik-injected header. The header is a
# semicolon-separated, URL-encoded list of `Key="value"` pairs — see
# https://doc.traefik.io/traefik/middlewares/http/passtlsclientcert/. We only
# expose what the frontend reads.
map $http_x_forwarded_tls_client_cert_info $cert_subject {
    "~*Subject=\"([^\"]+)\""    $1;
    default                     "-";
}
map $http_x_forwarded_tls_client_cert_info $cert_issuer {
    "~*Issuer=\"([^\"]+)\""     $1;
    default                     "-";
}
map $http_x_forwarded_tls_client_cert_info $cert_serial {
    "~*SerialNumber=\"([^\"]+)\""   $1;
    default                         "-";
}
map $http_x_forwarded_tls_client_cert_info $cert_not_before {
    "~*NB=\"([^\"]+)\""         $1;
    default                     "-";
}
map $http_x_forwarded_tls_client_cert_info $cert_not_after {
    "~*NA=\"([^\"]+)\""         $1;
    default                     "-";
}

server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # /cert-info — same 204 + X-Client-* contract as the old Cloudflare
    # Worker, so app.js does not change. Cache-Control is no-store because
    # the response depends on per-request TLS state.
    location = /cert-info {
        add_header X-Client-Verify        $cert_present always;
        add_header X-Client-Subject       $cert_subject always;
        add_header X-Client-Issuer        $cert_issuer always;
        add_header X-Client-Serial        $cert_serial always;
        add_header X-Client-Fingerprint   "-" always;
        add_header X-Client-Valid-From    $cert_not_before always;
        add_header X-Client-Valid-To      $cert_not_after always;
        add_header Access-Control-Expose-Headers
            "X-Client-Verify, X-Client-Subject, X-Client-Issuer, X-Client-Serial, X-Client-Fingerprint, X-Client-Valid-From, X-Client-Valid-To" always;
        add_header Cache-Control          "no-store" always;
        return 204;
    }

    # Debug — exposes the raw X-Forwarded-Tls-Client-Cert-Info header that
    # Traefik forwards, so we can see how a given client cert is actually
    # serialised (FNMT, ACCV, etc. each format Subject DNs differently).
    # Remove once the field-extraction regexes in nginx.conf cover all the
    # CAs we care about.
    location = /cert-debug {
        default_type text/plain;
        return 200 "X-Forwarded-Tls-Client-Cert-Info:\n$http_x_forwarded_tls_client_cert_info\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
