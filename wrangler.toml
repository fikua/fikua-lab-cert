# Cloudflare Worker (Static Assets + handler) configuration for
# https://cert.fikua.com.
#
# /cert-info is answered by the Worker function in src/index.ts using
# request.cf.tlsClientAuth that Cloudflare populates when mTLS is
# terminated at the edge. All other paths are served from the
# repository root as static assets.
#
# This project does NOT proxy to the lab backend, so it does not need
# the LAB_BACKEND_ORIGIN var nor the CF_ACCESS service-token secrets.
# Edge mTLS is configured outside of wrangler at:
#   Cloudflare → SSL/TLS → Client Certificates → Hosts → cert.fikua.com
#   (mode "Request client certificate"; no CA validation).

name = "fikua-lab-cert"
main = "src/index.ts"
compatibility_date = "2026-05-22"

routes = [
    { pattern = "cert.fikua.com/*", custom_domain = false, zone_name = "fikua.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
