name: CI

# Shared workflows: fikua/fikua-ci-workflows (ADR 0018). Publishes
# ghcr.io/fikua/fikua-lab-cert: latest and sha-<short> on every push to main,
# X.Y.Z on every v*.*.* tag (gh release create vX.Y.Z).
#
# Deploying is not done here: fikua-platform-iac pins the version in
# projects/fikua-lab/cert/compose.yaml and Dependabot there proposes each new
# X.Y.Z (ADR 0019).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: fikua/fikua-ci-workflows/.github/workflows/gitleaks.yml@617baa88c2f37b53b84a9024f72298da1caa35cf  # v1.3.0

  release:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: fikua/fikua-ci-workflows/.github/workflows/image-release.yml@383c2bdf97121b1405704f30468b0a45272cae73  # v1.2.0
    with:
      image: fikua-lab-cert
      dockerhub: false
